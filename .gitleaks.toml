title = "DriveGuard Gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
description = "Synthetic API-key-shaped values required by legacy unit and integration fixtures"
condition = "AND"
regexTarget = "line"
paths = [
  '''(^|.*/)tests/integration/phase7-runtime-lifecycle\.test\.ts$''',
  '''(^|.*/)tests/unit/phase15\.1-runtime-retention\.test\.ts$''',
  '''(^|.*/)tests/integration/phase9-postgres-redis-recovery\.test\.ts$''',
]
regexes = [
  '''^\s*const faux = fauxProvider\(\{ provider: "phase7-default", api: ".*" \}\);$''',
  '''^\s*const faux = fauxProvider\(\{ provider: "phase15-retention", api: ".*" \}\);$''',
  '''^\s*tokenHash:\s*".*",\s*$''',
]

  [[rules.allowlists]]
description = "Phase 15.3 local context-race evidence contains an HMAC-SHA256 confirmation proof, not a provider credential"
condition = "AND"
commits = [
  "9f73bb8d4e4268718e3d6fbc683aaebbd1393963",
]
paths = [
  '''^artifacts/15\.3-context-race-evidence-closure/reports/context-race/D/result\.json$''',
]

  [[rules.allowlists]]
description = "Phase 15.3 local synthetic semantic evidence contains HMAC-SHA256 confirmation proofs, not provider credentials"
condition = "AND"
commits = [
  "9f73bb8d4e4268718e3d6fbc683aaebbd1393963",
]
paths = [
  '''^artifacts/15\.3-context-race-evidence-closure/reports/semantic/prospective-summary\.json$''',
]

  [[rules.allowlists]]
description = "Phase 15.1 retained heap report command text is a non-credential false positive"
condition = "AND"
commits = [
  "d997fd2bad3cfb32e9c08537d0ae25de0e9c4392",
  "954fa1ff7b522cb401eadf44b2d54d21451b91d5",
]
paths = [
  '''^artifacts/15\.1-performance-qualification-closure/docs/heap-root-cause\.md$''',
]

  [[rules.allowlists]]
description = "Phase 17.2 immutable scanner and SBOM evidence has redacted generic-api-key false positives, not credentials"
condition = "AND"
commits = [
  "8c8281fb2d56289e902348893a07b877c63d3cba",
]
paths = [
  '''^artifacts/17\.2-security-remediation-closure/release-candidate\.json$''',
  '''^artifacts/17\.2-security-remediation-closure/reports/sbom/driveguard-api-a776ce2\.spdx\.json$''',
  '''^artifacts/17\.2-security-remediation-closure/reports/trivy/driveguard-api-final\.json$''',
]
