services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host", "0.0.0.0", "-config", "/config/toxiproxy.json"]
    volumes:
      - ./14-load-resilience/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "127.0.0.1:${TOXIPROXY_API_PORT:-8474}:8474"
      - "127.0.0.1:${TOXIPROXY_POSTGRES_PORT:-15432}:15432"
      - "127.0.0.1:${TOXIPROXY_REDIS_PORT:-16379}:16379"
      - "127.0.0.1:${TOXIPROXY_NATS_PORT:-14222}:14222"
      - "127.0.0.1:${TOXIPROXY_SIMULATOR_PORT:-13001}:13001"

  api:
    environment:
      PGHOST: toxiproxy
      PGPORT: 15432
      REDIS_URL: redis://toxiproxy:16379
      NATS_URL: nats://toxiproxy:14222
      SIMULATOR_BASE_URL: http://toxiproxy:13001
      DRIVEGUARD_DEVELOPMENT_SIMULATOR_ORIGINS: http://toxiproxy:13001
    depends_on:
      toxiproxy:
        condition: service_started
