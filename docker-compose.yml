name: driveguard

services:
  postgres:
    image: postgres:17-alpine@sha256:ae8a26b5b27ef277b46284a0faa2f0059e36a0b40b4064e3353e1bbaaaa2b214
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-driveguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-driveguard}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    restart: unless-stopped
    mem_limit: 512m

  redis:
    image: redis:8-alpine@sha256:642d3031f9c79ebc20ccbb4dca457a30dd06725b2f40c10b1ec0e17df90a5697
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
    restart: unless-stopped
    mem_limit: 256m

  nats:
    image: nats:2.11-alpine@sha256:8e9da4a39fad71bc91237fbe4cc68c2fefe7126c7608a0b3ee94f2084aacfd8c
    command: ["-js", "-m", "8222", "--store_dir", "/data/jetstream"]
    volumes:
      - nats-data:/data/jetstream
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- 'http://127.0.0.1:8222/healthz?js-enabled-only=true' | grep -q 'ok'",
        ]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
    restart: unless-stopped
    mem_limit: 256m

  api:
    image: driveguard-api:${DRIVEGUARD_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      PORT: 3000
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=160}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_APP_USER:-driveguard_app}
      PGPASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD must be set}
      PGDATABASE: ${POSTGRES_DB:-driveguard}
      PG_POOL_MAX: ${PG_POOL_MAX:-20}
      PG_CONNECTION_TIMEOUT_MS: ${PG_CONNECTION_TIMEOUT_MS:-1500}
      PG_IDLE_TIMEOUT_MS: ${PG_IDLE_TIMEOUT_MS:-30000}
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      SIMULATOR_BASE_URL: http://vehicle-simulator:3001
      DRIVEGUARD_LLM_PROVIDER: ${DRIVEGUARD_LLM_PROVIDER:-faux}
      PHASE_5_RUNTIME_MODE: ${PHASE_5_RUNTIME_MODE:-development}
      PHASE_5_DEVELOPMENT_OPT_IN: ${PHASE_5_DEVELOPMENT_OPT_IN:-NON_PRODUCTION}
      DRIVEGUARD_DEVELOPMENT_SIMULATOR_ORIGINS: http://vehicle-simulator:3001
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DRIVEGUARD_MAX_CONCURRENT_REQUESTS: ${DRIVEGUARD_MAX_CONCURRENT_REQUESTS:-20}
      DRIVEGUARD_MAX_REQUEST_QUEUE: ${DRIVEGUARD_MAX_REQUEST_QUEUE:-32}
      DRIVEGUARD_REQUEST_QUEUE_TIMEOUT_MS: ${DRIVEGUARD_REQUEST_QUEUE_TIMEOUT_MS:-500}
      DRIVEGUARD_MAX_READ_EXECUTIONS: ${DRIVEGUARD_MAX_READ_EXECUTIONS:-4}
      DRIVEGUARD_MAX_WRITE_EXECUTIONS: ${DRIVEGUARD_MAX_WRITE_EXECUTIONS:-8}
      DRIVEGUARD_MAX_EXECUTOR_QUEUE: ${DRIVEGUARD_MAX_EXECUTOR_QUEUE:-256}
      DRIVEGUARD_EXECUTOR_QUEUE_TIMEOUT_MS: ${DRIVEGUARD_EXECUTOR_QUEUE_TIMEOUT_MS:-5000}
      DRIVEGUARD_AGENT_TIMEOUT_MS: ${DRIVEGUARD_AGENT_TIMEOUT_MS:-15000}
      DRIVEGUARD_SHUTDOWN_TIMEOUT_MS: ${DRIVEGUARD_SHUTDOWN_TIMEOUT_MS:-30000}
      URGENT_EVENT_USER_ID: ${URGENT_EVENT_USER_ID:-phase5-driver}
      URGENT_CONFIRMATION_SECRET: ${URGENT_CONFIRMATION_SECRET:?URGENT_CONFIRMATION_SECRET must be set}
    ports:
      - "127.0.0.1:${DRIVEGUARD_API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      persistence-migrate:
        condition: service_completed_successfully
      vehicle-simulator:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    restart: unless-stopped
    init: true
    stop_grace_period: ${DRIVEGUARD_SHUTDOWN_TIMEOUT_MS:-30}s
    mem_limit: 512m

  persistence-migrate:
    image: driveguard-api:${DRIVEGUARD_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ["node", "dist/packages/persistence/src/migrate-cli.js"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-driveguard}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGDATABASE: ${POSTGRES_DB:-driveguard}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-driveguard_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD must be set}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 256m

  vehicle-simulator:
    image: driveguard-simulator:${DRIVEGUARD_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: infra/docker/vehicle-simulator.Dockerfile
    environment:
      PORT: 3001
    ports:
      - "127.0.0.1:${VEHICLE_SIMULATOR_PORT:-3001}:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    mem_limit: 256m

  hmi:
    image: driveguard-hmi:${DRIVEGUARD_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: infra/docker/hmi.Dockerfile
    environment:
      DRIVEGUARD_API_ORIGIN: http://api:3000
    ports:
      - "127.0.0.1:${DRIVEGUARD_HMI_PORT:-3002}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/').then(async r=>{if(!r.ok||!(await r.text()).includes('DriveGuard HMI'))process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    mem_limit: 128m

  prometheus:
    image: prom/prometheus:v3.13.1
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3003}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q 'ok'"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  nats-data:
  prometheus-data:
  grafana-data:
