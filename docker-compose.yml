name: driveguard

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-driveguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-driveguard}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
    restart: unless-stopped

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-m", "8222", "--store_dir", "/data/jetstream"]
    volumes:
      - nats-data:/data/jetstream
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- 'http://127.0.0.1:8222/healthz?js-enabled-only=true' | grep -q 'ok'",
        ]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
    restart: unless-stopped

  api:
    image: driveguard-api:phase11
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      PORT: 3000
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_APP_USER:-driveguard_app}
      PGPASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD must be set}
      PGDATABASE: ${POSTGRES_DB:-driveguard}
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      SIMULATOR_BASE_URL: http://vehicle-simulator:3001
      DRIVEGUARD_LLM_PROVIDER: ${DRIVEGUARD_LLM_PROVIDER:-faux}
      PHASE_5_RUNTIME_MODE: ${PHASE_5_RUNTIME_MODE:-development}
      PHASE_5_DEVELOPMENT_OPT_IN: ${PHASE_5_DEVELOPMENT_OPT_IN:-NON_PRODUCTION}
      DRIVEGUARD_DEVELOPMENT_SIMULATOR_ORIGINS: http://vehicle-simulator:3001
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "127.0.0.1:${DRIVEGUARD_API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      persistence-migrate:
        condition: service_completed_successfully
      vehicle-simulator:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  persistence-migrate:
    image: driveguard-api:phase11
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ["node", "dist/packages/persistence/src/migrate-cli.js"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-driveguard}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGDATABASE: ${POSTGRES_DB:-driveguard}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-driveguard_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD must be set}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  vehicle-simulator:
    image: driveguard-vehicle-simulator:phase3
    build:
      context: .
      dockerfile: infra/docker/vehicle-simulator.Dockerfile
    environment:
      PORT: 3001
    ports:
      - "127.0.0.1:${VEHICLE_SIMULATOR_PORT:-3001}:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
    restart: unless-stopped

  hmi:
    image: driveguard-hmi:phase10
    build:
      context: .
      dockerfile: infra/docker/hmi.Dockerfile
    environment:
      DRIVEGUARD_API_ORIGIN: http://api:3000
    ports:
      - "127.0.0.1:${DRIVEGUARD_HMI_PORT:-3002}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/').then(async r=>{if(!r.ok||!(await r.text()).includes('DriveGuard HMI'))process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3003}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q 'ok'"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  nats-data:
  prometheus-data:
  grafana-data:
